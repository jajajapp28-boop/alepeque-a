<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti 🫶🏻</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Great+Vibes&family=Caveat:wght@400;700&display=swap" rel="stylesheet">

<body>

    <!-- Fondo -->
    <div class="background"></div>

    <!-- Partículas -->
    <div id="particles"></div>

    <!-- Contenedor principal -->
    <main class="container">

        <h1 class="titulo">
            Un pequeño detalle para ti, solo por bonita 💗
        </h1>

        <p class="subtitulo">
            Toca la carta pues ale jsjs.
        </p>

        <!-- Ramo -->
        <section class="bouquet">

            <!-- Flores -->
            <div class="flowers">
    <img src="ramo.png" class="ramo-real" alt="Ramo">
            </div>
            <!-- Carta -->
            <div id="envelope">
    <img src="sobre.png" alt="Sobre">
            </div>

        </section>

    </main>

    <!-- Carta completa -->
    <section id="letterModal">

        <div class="paper">

            <button id="close">
                ✕
            </button>

            <h2>
                Para Ti 🌸
            </h2>

            <div id="typing">

            </div>

        </div>

    </section>

    <!-- Música -->
    <audio id="music" loop>

        <source src="music.mp3" type="audio/mpeg">

    </audio>

    <script src="script.js"></script>

</body>
</html>
